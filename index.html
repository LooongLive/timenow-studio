<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeNow Studio</title>
  <meta name="description" content="A modern glass world clock and countdown page.">
  <style>
:root {
  --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --background: #080a10;
  --foreground: #f8fbff;
}



* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-system);
}

button,
input {
  font: inherit;
}

.time-app {
  --bg-a: #090b15;
  --bg-b: #10243a;
  --bg-c: #513a93;
  --accent: #86f7ff;
  --accent-2: #b7ff6d;
  --text: #f7fbff;
  --muted: rgba(247, 251, 255, 0.66);
  --glass: rgba(255, 255, 255, 0.12);
  --glass-strong: rgba(255, 255, 255, 0.22);
  --line: rgba(255, 255, 255, 0.22);
  --shadow: rgba(0, 0, 0, 0.34);
  --motion-a: color-mix(in srgb, var(--accent) 46%, transparent);
  --motion-b: color-mix(in srgb, var(--accent-2) 36%, transparent);
  --motion-c: rgba(255, 255, 255, 0.18);
  --pixel-font: "Courier New", Monaco, "Lucida Console", monospace;
  --lcd-font: "Lucida Console", Monaco, "Courier New", monospace;
  --ink-font: "HanziPen SC", "Xingkai SC", "Baoli SC", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Hiragino Mincho ProN", "Times New Roman", serif;
  position: relative;
  display: grid;
  place-items: center;
  height: 100vh;
  min-height: 620px;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 30%),
    radial-gradient(circle at 82% 20%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 28%),
    linear-gradient(135deg, var(--bg-a), var(--bg-b) 48%, var(--bg-c));
  color: var(--text);
  font-family: var(--display-font);
}

.time-app[data-theme="graphite"] {
  --bg-a: #08090b;
  --bg-b: #242832;
  --bg-c: #5d6571;
  --accent: #d7e3f1;
  --accent-2: #8ea0b7;
  --motion-a: rgba(215, 227, 241, 0.26);
  --motion-b: rgba(142, 160, 183, 0.24);
  --motion-c: rgba(255, 255, 255, 0.1);
}

.time-app[data-theme="alpine"] {
  --bg-a: #edf4ff;
  --bg-b: #cbd9ec;
  --bg-c: #91aecf;
  --accent: #0b63ce;
  --accent-2: #08a3a8;
  --text: #07131f;
  --muted: rgba(7, 19, 31, 0.62);
  --glass: rgba(255, 255, 255, 0.5);
  --glass-strong: rgba(255, 255, 255, 0.66);
  --line: rgba(20, 40, 65, 0.16);
  --shadow: rgba(70, 93, 120, 0.25);
  --motion-a: rgba(11, 99, 206, 0.18);
  --motion-b: rgba(8, 163, 168, 0.16);
  --motion-c: rgba(255, 255, 255, 0.34);
}

.time-app[data-theme="cobalt"] {
  --bg-a: #020817;
  --bg-b: #073b83;
  --bg-c: #031f44;
  --accent: #39d5ff;
  --accent-2: #ffffff;
  --motion-a: rgba(57, 213, 255, 0.34);
  --motion-b: rgba(255, 255, 255, 0.16);
  --motion-c: rgba(21, 83, 170, 0.22);
}

.time-app[data-theme="ember"] {
  --bg-a: #130906;
  --bg-b: #662817;
  --bg-c: #ad6d20;
  --accent: #ffd36f;
  --accent-2: #ff7a59;
  --motion-a: rgba(255, 211, 111, 0.25);
  --motion-b: rgba(255, 122, 89, 0.26);
  --motion-c: rgba(255, 245, 220, 0.12);
}

.time-app[data-theme="orchid"] {
  --bg-a: #10051b;
  --bg-b: #4a145f;
  --bg-c: #0b2851;
  --accent: #f49cff;
  --accent-2: #78e0ff;
  --motion-a: rgba(244, 156, 255, 0.28);
  --motion-b: rgba(120, 224, 255, 0.24);
  --motion-c: rgba(255, 255, 255, 0.13);
}

.time-app[data-theme="mint"] {
  --bg-a: #061615;
  --bg-b: #0f504c;
  --bg-c: #9bd6b0;
  --accent: #94ffe7;
  --accent-2: #eaffb7;
  --motion-a: rgba(148, 255, 231, 0.24);
  --motion-b: rgba(234, 255, 183, 0.2);
  --motion-c: rgba(121, 205, 156, 0.18);
}

.time-app[data-theme="mono"] {
  --bg-a: #f7f7f4;
  --bg-b: #d9d9d4;
  --bg-c: #161616;
  --accent: #111111;
  --accent-2: #707070;
  --text: #101010;
  --muted: rgba(16, 16, 16, 0.62);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.75);
  --line: rgba(0, 0, 0, 0.16);
  --motion-a: rgba(0, 0, 0, 0.1);
  --motion-b: rgba(255, 255, 255, 0.28);
  --motion-c: rgba(120, 120, 120, 0.12);
}

.time-app[data-theme="midnight"] {
  --bg-a: #02040a;
  --bg-b: #111827;
  --bg-c: #22304d;
  --accent: #7dd3fc;
  --accent-2: #c4b5fd;
  --motion-a: rgba(125, 211, 252, 0.2);
  --motion-b: rgba(196, 181, 253, 0.2);
  --motion-c: rgba(255, 255, 255, 0.08);
}

.time-app[data-theme="rose"] {
  --bg-a: #1b0810;
  --bg-b: #5f2038;
  --bg-c: #d7a295;
  --accent: #ffd0dc;
  --accent-2: #ffb86c;
  --motion-a: rgba(255, 208, 220, 0.24);
  --motion-b: rgba(255, 184, 108, 0.2);
  --motion-c: rgba(255, 255, 255, 0.12);
}

.time-app[data-theme="solar"] {
  --bg-a: #100d04;
  --bg-b: #4a3d07;
  --bg-c: #e9a92f;
  --accent: #fff4a8;
  --accent-2: #45ffd0;
  --motion-a: rgba(255, 244, 168, 0.2);
  --motion-b: rgba(69, 255, 208, 0.2);
  --motion-c: rgba(255, 186, 74, 0.16);
}

.time-app[data-theme="ocean"] {
  --bg-a: #03131f;
  --bg-b: #064667;
  --bg-c: #1e8b98;
  --accent: #85f3ff;
  --accent-2: #b3f5c8;
  --motion-a: rgba(133, 243, 255, 0.22);
  --motion-b: rgba(179, 245, 200, 0.18);
  --motion-c: rgba(35, 120, 170, 0.18);
}

.time-app[data-theme="pixel"] {
  --bg-a: #05040a;
  --bg-b: #15132b;
  --bg-c: #0a302c;
  --accent: #7cff6b;
  --accent-2: #58e0ff;
  --text: #f4ffe8;
  --muted: rgba(244, 255, 232, 0.62);
  --glass: rgba(20, 255, 142, 0.08);
  --glass-strong: rgba(90, 224, 255, 0.16);
  --line: rgba(124, 255, 107, 0.22);
  --shadow: rgba(0, 0, 0, 0.42);
  --motion-a: rgba(124, 255, 107, 0.22);
  --motion-b: rgba(88, 224, 255, 0.18);
  --motion-c: rgba(255, 255, 255, 0.1);
  image-rendering: pixelated;
}

.time-app[data-theme="pixel"],
.time-app[data-theme="pixel"] button,
.time-app[data-theme="pixel"] input {
  font-family: var(--pixel-font);
}

.time-app[data-theme="lcd"] {
  --bg-a: #162f4d;
  --bg-b: #4f8d55;
  --bg-c: #6b4a2d;
  --accent: #9dff63;
  --accent-2: #7bd2ff;
  --text: #f4ffe8;
  --muted: rgba(244, 255, 232, 0.64);
  --glass: rgba(60, 120, 70, 0.12);
  --glass-strong: rgba(160, 255, 110, 0.16);
  --line: rgba(173, 255, 112, 0.24);
  --shadow: rgba(0, 0, 0, 0.48);
  --motion-a: rgba(118, 255, 83, 0.22);
  --motion-b: rgba(117, 82, 48, 0.18);
  --motion-c: rgba(123, 210, 255, 0.12);
  background:
    linear-gradient(180deg, rgba(123, 210, 255, 0.24), transparent 34%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.028) 0 18px, transparent 18px 36px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.045) 0 18px, transparent 18px 36px),
    linear-gradient(135deg, var(--bg-a) 0 35%, var(--bg-b) 35% 68%, var(--bg-c) 68% 100%);
  image-rendering: pixelated;
}

.time-app[data-theme="lcd"],
.time-app[data-theme="lcd"] button,
.time-app[data-theme="lcd"] input {
  font-family: var(--lcd-font);
  text-transform: uppercase;
}

.time-app[data-theme="ink"] {
  --bg-a: #f3efe3;
  --bg-b: #d8ddcf;
  --bg-c: #6c837b;
  --accent: #1b5f63;
  --accent-2: #b94b38;
  --text: #17201d;
  --muted: rgba(23, 32, 29, 0.58);
  --glass: rgba(255, 255, 255, 0.22);
  --glass-strong: rgba(255, 255, 255, 0.38);
  --line: rgba(33, 48, 42, 0.15);
  --shadow: rgba(40, 48, 41, 0.24);
  --motion-a: rgba(22, 56, 48, 0.16);
  --motion-b: rgba(27, 95, 99, 0.13);
  --motion-c: rgba(185, 75, 56, 0.1);
  background:
    radial-gradient(ellipse at 18% 20%, rgba(27, 95, 99, 0.16), transparent 34%),
    radial-gradient(ellipse at 86% 68%, rgba(185, 75, 56, 0.12), transparent 32%),
    radial-gradient(ellipse at 62% 36%, rgba(23, 32, 29, 0.08), transparent 26%),
    linear-gradient(135deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
}

.time-app[data-theme="ink"]::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    repeating-linear-gradient(90deg, rgba(32, 41, 36, 0.022) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 8px),
    radial-gradient(circle at 22% 75%, rgba(255, 255, 255, 0.2), transparent 24%);
  mix-blend-mode: multiply;
  opacity: 0.54;
  pointer-events: none;
}

.time-app[data-theme="ink"],
.time-app[data-theme="ink"] button,
.time-app[data-theme="ink"] input {
  font-family: var(--ink-font);
}

.time-app[data-theme="dotmatrix"] {
  --bg-a: #02050c;
  --bg-b: #061823;
  --bg-c: #0d2f2b;
  --accent: #75f4df;
  --accent-2: #d6e889;
  --text: #e9fff9;
  --muted: rgba(233, 255, 249, 0.66);
  --glass: rgba(117, 244, 223, 0.06);
  --glass-strong: rgba(255, 255, 255, 0.13);
  --line: rgba(117, 244, 223, 0.18);
  --shadow: rgba(0, 0, 0, 0.48);
  --motion-a: rgba(117, 244, 223, 0.2);
  --motion-b: rgba(214, 232, 137, 0.14);
  --motion-c: rgba(255, 255, 255, 0.12);
  background:
    radial-gradient(circle at 50% 30%, rgba(214, 232, 137, 0.18), transparent 22%),
    radial-gradient(circle at 22% 56%, rgba(117, 244, 155, 0.13), transparent 24%),
    radial-gradient(circle at 80% 60%, rgba(214, 232, 137, 0.12), transparent 22%),
    radial-gradient(circle at 58% 44%, rgba(117, 244, 223, 0.12), transparent 24%),
    linear-gradient(180deg, #02050c 0 48%, #03090f 48% 100%);
  image-rendering: pixelated;
}

.time-app[data-theme="dotmatrix"]::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(circle at 36% 32%, rgba(255, 255, 255, 0.34) 0 1px, transparent 1.3px),
    radial-gradient(circle at 50% 50%, rgba(117, 244, 223, 0.38) 0 3.7px, rgba(4, 12, 20, 0.84) 4.1px 6.8px, transparent 7.1px),
    radial-gradient(circle at 50% 50%, rgba(214, 232, 137, 0.24) 0 3.7px, rgba(4, 12, 20, 0.84) 4.1px 6.8px, transparent 7.1px),
    radial-gradient(circle at 50% 50%, rgba(85, 206, 126, 0.25) 0 3.7px, rgba(4, 12, 20, 0.84) 4.1px 6.8px, transparent 7.1px),
    radial-gradient(circle at 50% 50%, rgba(5, 12, 22, 0.88) 0 3.7px, rgba(0, 0, 0, 0.92) 4.1px 6.8px, transparent 7.1px);
  background-size: 15px 15px, 15px 15px, 15px 15px, 15px 15px, 15px 15px;
  background-position: 0 0, 0 0, 5px 8px, 9px 2px, 11px 11px;
  mix-blend-mode: screen;
  opacity: 0.5;
  pointer-events: none;
}

.time-app[data-theme="dotmatrix"],
.time-app[data-theme="dotmatrix"] button,
.time-app[data-theme="dotmatrix"] input {
  font-family: var(--pixel-font);
}

.time-app.is-countdown-done {
  --bg-a: #200306;
  --bg-b: #7b0b15;
  --bg-c: #e73844;
  --accent: #ffb8bd;
  --accent-2: #fff0ef;
  --glass: rgba(255, 255, 255, 0.14);
  --glass-strong: rgba(255, 210, 214, 0.25);
}

.time-app.is-countdown-done::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.14), transparent 34%),
    linear-gradient(135deg, rgba(120, 0, 12, 0.5), rgba(255, 50, 64, 0.22));
  pointer-events: none;
}

.ambient {
  position: absolute;
  border-radius: 999px;
  filter: blur(34px);
  opacity: 0.46;
  pointer-events: none;
  will-change: transform, width, height;
  transition: opacity 3600ms ease, filter 3600ms ease;
}

.time-app.is-ambient-refreshing .ambient {
  opacity: 0.035;
  filter: blur(54px) saturate(0.72);
}

.ambient-one {
  width: 34vw;
  height: 34vw;
  left: -10vw;
  top: -11vw;
  background: var(--accent);
}

.ambient-two {
  width: 30vw;
  height: 30vw;
  right: -8vw;
  bottom: -10vw;
  background: var(--accent-2);
}

.motion-field {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 0.74;
  mix-blend-mode: screen;
  transition: opacity 4200ms ease, filter 4200ms ease;
}

.motion-field.is-refreshing {
  opacity: 0.025;
  filter: blur(26px) saturate(0.72);
}

.motion-shape {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  min-width: 88px;
  min-height: 88px;
  border-radius: 999px;
  background:
    radial-gradient(circle at 34% 28%, var(--motion-c), transparent 22%),
    linear-gradient(145deg, var(--motion-a), var(--motion-b));
  filter: blur(24px) saturate(125%);
  opacity: 0.46;
  will-change: transform;
}

.motion-shape-2,
.motion-shape-5 {
  border-radius: 36% 64% 58% 42% / 46% 32% 68% 54%;
  filter: blur(28px) saturate(135%);
}

.motion-shape-3 {
  border-radius: 8px;
  filter: blur(30px) saturate(120%);
  transform-origin: center;
}

.motion-shape-4 {
  border-radius: 52% 48% 38% 62% / 42% 56% 44% 58%;
  background:
    conic-gradient(from 120deg, var(--motion-a), var(--motion-c), var(--motion-b), var(--motion-a));
  opacity: 0.34;
}

.motion-shape-6 {
  border-radius: 999px 999px 42% 58%;
  opacity: 0.28;
}

.time-app[data-theme="graphite"] .motion-shape,
.time-app[data-theme="mono"] .motion-shape {
  mix-blend-mode: multiply;
}

.time-app[data-theme="cobalt"] .motion-shape-3,
.time-app[data-theme="midnight"] .motion-shape-3 {
  border-radius: 4px;
  opacity: 0.28;
}

.time-app[data-theme="ember"] .motion-shape,
.time-app[data-theme="solar"] .motion-shape {
  filter: blur(30px) saturate(150%);
}

.time-app[data-theme="pixel"] .motion-field {
  opacity: 0.72;
}

.time-app[data-theme="pixel"] .motion-shape {
  border-radius: 6px;
  background:
    linear-gradient(90deg, transparent 0 16%, var(--motion-a) 16% 34%, transparent 34% 52%, var(--motion-b) 52% 74%, transparent 74%),
    linear-gradient(0deg, transparent 0 18%, var(--motion-c) 18% 34%, transparent 34% 58%, var(--motion-a) 58% 76%, transparent 76%);
  filter: blur(18px) saturate(145%);
  opacity: 0.42;
}

.time-app[data-theme="pixel"] .motion-shape-2,
.time-app[data-theme="pixel"] .motion-shape-4,
.time-app[data-theme="pixel"] .motion-shape-6 {
  border-radius: 2px;
  transform-origin: center;
}

.time-app[data-theme="lcd"] .motion-field {
  opacity: 0.66;
  mix-blend-mode: normal;
}

.time-app[data-theme="lcd"] .motion-shape {
  border-radius: 4px;
  background:
    linear-gradient(180deg, rgba(157, 255, 99, 0.48) 0 28%, rgba(78, 151, 70, 0.42) 28% 46%, rgba(112, 77, 44, 0.34) 46% 100%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.11) 0 10px, transparent 10px 22px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 10px, transparent 10px 22px);
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.06),
    inset 0 -18px 0 rgba(80, 53, 35, 0.12);
  filter: blur(14px) saturate(126%);
  opacity: 0.4;
}

.time-app[data-theme="lcd"] .motion-shape-2,
.time-app[data-theme="lcd"] .motion-shape-5 {
  border-radius: 2px;
  background:
    linear-gradient(135deg, rgba(112, 84, 54, 0.34), rgba(84, 54, 36, 0.24)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 12px, transparent 12px 24px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 12px, transparent 12px 24px);
}

.time-app[data-theme="lcd"] .motion-shape-3,
.time-app[data-theme="lcd"] .motion-shape-6 {
  border-radius: 3px;
  background:
    linear-gradient(135deg, rgba(123, 210, 255, 0.32), rgba(157, 255, 99, 0.22)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.13) 0 9px, transparent 9px 18px),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1) 0 9px, transparent 9px 18px);
  filter: blur(17px) saturate(125%);
}

.time-app[data-theme="ink"] .motion-field {
  opacity: 0.5;
  mix-blend-mode: multiply;
}

.time-app[data-theme="ink"] .motion-shape {
  border-radius: 45% 55% 60% 40% / 42% 50% 50% 58%;
  background:
    radial-gradient(ellipse at 34% 28%, rgba(255, 255, 255, 0.22), transparent 22%),
    radial-gradient(ellipse at 54% 56%, var(--motion-a), transparent 58%),
    radial-gradient(ellipse at 44% 42%, var(--motion-b), transparent 72%);
  filter: blur(26px) saturate(90%);
  opacity: 0.42;
}

.time-app[data-theme="ink"] .motion-shape-2,
.time-app[data-theme="ink"] .motion-shape-5 {
  background:
    radial-gradient(ellipse at 44% 46%, rgba(23, 32, 29, 0.18), transparent 64%),
    radial-gradient(ellipse at 58% 38%, var(--motion-c), transparent 72%);
  filter: blur(30px) saturate(80%);
  opacity: 0.34;
}

.time-app[data-theme="ink"] .motion-shape-3,
.time-app[data-theme="ink"] .motion-shape-6 {
  border-radius: 999px 46% 64% 52%;
  background:
    radial-gradient(ellipse at 42% 48%, rgba(27, 95, 99, 0.14), transparent 62%),
    radial-gradient(ellipse at 62% 36%, rgba(255, 255, 255, 0.14), transparent 66%);
  opacity: 0.28;
}

.time-app[data-theme="dotmatrix"] .motion-field {
  opacity: 0.32;
  mix-blend-mode: screen;
}

.time-app[data-theme="dotmatrix"] .motion-shape {
  border-radius: 999px;
  background:
    radial-gradient(circle at 36% 32%, rgba(255, 255, 255, 0.48) 0 1.1px, transparent 1.4px),
    radial-gradient(circle, rgba(117, 244, 223, 0.32) 0 3.8px, transparent 4.4px),
    radial-gradient(circle at 48% 52%, rgba(214, 232, 137, 0.13), transparent 64%);
  background-size: 14px 14px, 14px 14px, 100% 100%;
  filter: blur(13px) saturate(128%);
  opacity: 0.28;
}

.time-app[data-theme="dotmatrix"] .motion-shape-2,
.time-app[data-theme="dotmatrix"] .motion-shape-5 {
  border-radius: 28% 72% 42% 58% / 62% 38% 62% 38%;
}

.time-app[data-theme="dotmatrix"] .motion-shape-3,
.time-app[data-theme="dotmatrix"] .motion-shape-6 {
  background:
    radial-gradient(circle at 36% 32%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.3px),
    radial-gradient(circle, rgba(214, 232, 137, 0.28) 0 3.6px, transparent 4.2px),
    radial-gradient(circle at 42% 48%, rgba(117, 244, 223, 0.18), transparent 62%);
  background-size: 13px 13px, 13px 13px, 100% 100%;
}

.time-app[data-theme="alpine"] .motion-field,
.time-app[data-theme="mono"] .motion-field {
  mix-blend-mode: normal;
  opacity: 0.58;
}

.time-app.is-countdown-done .motion-field {
  opacity: 0.34;
}

.glass-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background:
    linear-gradient(140deg, var(--glass-strong), transparent 120%),
    var(--glass);
  box-shadow: 0 22px 70px var(--shadow);
  backdrop-filter: blur(28px) saturate(150%);
}

.hourglass-button,
.language-button {
  position: fixed;
  z-index: 10;

@media (max-width: 720px) {

    $(".custom-duration label:nth-child(1)").childNodes[0].textContent = text().hours;
    $(".custom-duration label:nth-child(2)").childNodes[0].textContent = text().minutes;
    $(".custom-duration label:nth-child(3)").childNodes[0].textContent = text().seconds;
    $(".start-button").textContent = text().start;
    $(".bottom-switch [data-action='countdown']").textContent = text().countdown;
    $(".countdown-face span").textContent = countdownDone ? text().done : text().remaining;
    $(".countdown-face time").textContent = countdownDone ? formatDuration(Math.abs(countdownDelta)) : formatDuration(countdownDelta, true);
    $(".countdown-face small").textContent = countdownDone ? `${text().elapsedPrefix} ${formatDuration(Math.abs(countdownDelta))}` : text().afterZero;
  }
  function closePanels() {
    openMenu = null;
    settingsOpen = false;
    mode = "home";
    render();
  }
  function returnToNow() {
    displayMode = "local";
    countdownStarted = false;
    closePanels();
  }
  function startPresetCountdown(minutes) {
    const startedAt = new Date();
    now = startedAt;
    const preset = countdownPresets.find((item) => item.minutes === minutes);
    const id = preset?.id || activeCountdownId;
    activeCountdownId = id;
    countdownStarted = true;
    countdownStarts[id] = startedAt.toISOString();
    countdowns = countdowns.map((item) => item.id === id ? { ...item, title: preset?.label.zh || item.title, target: toLocalDateTimeValue(new Date(startedAt.getTime() + minutes * 60000)) } : item);
    displayMode = "countdown";
    mode = "home";
    openMenu = null;
    render();
  }
  function showCustomCountdown() {
    const startedAt = new Date();
    now = startedAt;
    activeCountdownId = "custom";
    countdownStarted = false;
    countdownStarts.custom = startedAt.toISOString();
    countdowns = countdowns.map((item) => item.id === "custom" ? { ...item, title: "自定义倒计时", target: toLocalDateTimeValue(new Date(startedAt.getTime() + parseCustomDuration() * 1000)) } : item);
    openMenu = null;
    render();
  }
  function startActiveCountdown() {
    const startedAt = new Date();
    now = startedAt;
    countdownStarted = true;
    countdownStarts[activeCountdownId] = startedAt.toISOString();
    if (activeCountdownId === "custom") {
      countdowns = countdowns.map((item) => item.id === "custom" ? { ...item, title: "自定义倒计时", target: toLocalDateTimeValue(new Date(startedAt.getTime() + parseCustomDuration() * 1000)) } : item);
    }
    displayMode = "countdown";
    mode = "home";
    openMenu = null;
    render();
  }
  function startMotion() {
    const particleCount = 12;
    const motionElements = Array.from(document.querySelectorAll(".motion-shape"));
    const ambientElements = Array.from(document.querySelectorAll(".ambient"));
    const makeParticle = (index, scale = 1) => {
      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      const sizeValue = Math.min(viewportW, viewportH) * scale * (0.1 + Math.random() * 0.16);
      const angle = Math.random() * Math.PI * 2;
      const speed = (16 + Math.random() * 28) / Math.sqrt(scale);
      return {
        x: Math.random() * Math.max(1, viewportW - sizeValue),
        y: Math.random() * Math.max(1, viewportH - sizeValue),
        vx: Math.cos(angle) * speed * (index % 3 === 0 ? 0.72 : 1),
        vy: Math.sin(angle) * speed * (index % 4 === 0 ? 0.68 : 1),
        size: sizeValue,
      };
    };
    const particles = Array.from({ length: particleCount }, (_, index) => makeParticle(index));
    const ambientParticles = [makeParticle(0, 2.1), makeParticle(1, 1.85)].map((item, index) => ({
      ...item,
      vx: item.vx * (0.34 + index * 0.08),
      vy: item.vy * (0.34 + index * 0.08),
    }));
    let last = performance.now();
    let lastRefreshBucket = -1;
    let refreshTimeout = 0;
    const resetParticle = (item, index, scale = 1) => {
      const next = makeParticle(index, scale);
      Object.assign(item, next);
    };
    const refreshParticles = () => {
      $(".motion-field").classList.add("is-refreshing");
      app.classList.add("is-ambient-refreshing");
      clearTimeout(refreshTimeout);
      refreshTimeout = window.setTimeout(() => {
        particles.forEach((item, index) => resetParticle(item, index));
        ambientParticles.forEach((item, index) => resetParticle(item, index, index === 0 ? 2.1 : 1.85));
        window.setTimeout(() => {
          $(".motion-field").classList.remove("is-refreshing");
          app.classList.remove("is-ambient-refreshing");
        }, 700);
      }, 4300);
    };
    const moveParticle = (item, dt, width, height) => {
      item.x += item.vx * dt;
      item.y += item.vy * dt;
      if (item.x <= -item.size * 0.12 || item.x + item.size >= width + item.size * 0.12) {
        item.vx *= -1;
        item.x = Math.min(width + item.size * 0.12 - item.size, Math.max(-item.size * 0.12, item.x));
      }
      if (item.y <= -item.size * 0.12 || item.y + item.size >= height + item.size * 0.12) {
        item.vy *= -1;
        item.y = Math.min(height + item.size * 0.12 - item.size, Math.max(-item.size * 0.12, item.y));
      }
    };
    const tick = (time) => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dt = Math.min(0.04, (time - last) / 1000);
      last = time;
      const second = new Date().getSeconds();
      const refreshBucket = Math.floor(Date.now() / 10000);
      if (animationEnabled && second % 10 === 0 && refreshBucket !== lastRefreshBucket) {
        lastRefreshBucket = refreshBucket;
        refreshParticles();
      }
      particles.forEach((item, index) => {
        moveParticle(item, dt, width, height);
        const element = motionElements[index];
        if (element) {
          element.style.width = `${item.size}px`;
          element.style.height = `${item.size}px`;
          element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
        }
      });
      ambientParticles.forEach((item, index) => {
        const element = ambientElements[index];
        const pulse = 1 + Math.sin(time / (3800 + index * 950) + index * 1.7) * 0.075;
        moveParticle(item, dt, width, height);
        if (element) {
          element.style.width = `${item.size * pulse}px`;
          element.style.height = `${item.size * pulse}px`;
          element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
        }
      });
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  loadPreferences();
  makeCountdowns();
  startMotion();
  $(".language-button").addEventListener("click", (event) => {
    event.stopPropagation();
    language = language === "zh" ? "en" : "zh";
    openMenu = null;
    savePreferences();
    render();
  });
  $(".hourglass-button").addEventListener("click", (event) => { event.stopPropagation(); settingsOpen = !settingsOpen; openMenu = null; render(); });
  $("#sizeControl").addEventListener("input", (event) => { size = Number(event.target.value); savePreferences(); render(); });
  $("#fontSelect").addEventListener("click", (event) => {
    const fontButton = event.target.closest("[data-font]");
    if (fontButton) { font = decodeURIComponent(fontButton.dataset.font); openMenu = null; savePreferences(); render(); return; }
    if (event.target.closest(".glass-select-trigger")) { openMenu = openMenu === "font" ? null : "font"; render(); }
  });
  $(".theme-grid").addEventListener("click", (event) => {
    const button = event.target.closest("[data-theme]");
    if (!button) return;
    theme = button.dataset.theme;
    openMenu = null;
    savePreferences();
    render();
  });
  $(".settings-toggle button").addEventListener("click", () => {
    animationEnabled = !animationEnabled;
    savePreferences();
    render();
  });
  $(".world-dock").addEventListener("click", (event) => {
    const addButton = event.target.closest(".world-add-button");
    if (addButton) { openMenu = openMenu === "world-add" ? null : "world-add"; render(); return; }
    const option = event.target.closest("[data-zone]");
    if (option) {
      const card = event.target.closest(".world-clock-card");
      if (openMenu === "world-add") {
        if (!worldClocks.includes(option.dataset.zone) && worldClocks.length < 3) worldClocks.push(option.dataset.zone);
      } else if (card) {
        worldClocks[Number(card.dataset.index)] = option.dataset.zone;
      }
      openMenu = null;
      savePreferences();
      render();
      return;
    }
    const timeButton = event.target.closest(".world-time-button");
    if (timeButton) {
      const index = Number(event.target.closest(".world-clock-card").dataset.index);
      openMenu = openMenu === `world-${index}` ? null : `world-${index}`;
      render();
      return;
    }
    const deleteButton = event.target.closest(".world-card-actions button");
    if (deleteButton) {
      const index = Number(event.target.closest(".world-clock-card").dataset.index);
      worldClocks = worldClocks.filter((_, itemIndex) => itemIndex !== index);
      openMenu = null;
      savePreferences();
      render();
    }
  });
  $(".world-resize-handle").addEventListener("pointerdown", (event) => {
    event.preventDefault();
    event.stopPropagation();
    const startX = event.clientX;
    const startY = event.clientY;
    const startScale = worldScale;
    const onMove = (moveEvent) => {
      const delta = (moveEvent.clientX - startX + moveEvent.clientY - startY) / 360;
      worldScale = Math.min(1.45, Math.max(0.78, startScale + delta));
      savePreferences();
      render();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
  $(".preset-row").addEventListener("click", (event) => {
    const button = event.target.closest("[data-preset]");
    if (!button) return;
    if (button.dataset.preset === "custom") {
      showCustomCountdown();
      return;
    }
    const preset = countdownPresets.find((item) => item.id === button.dataset.preset);
    if (preset) startPresetCountdown(preset.minutes);
  });
  $(".countdown-style-row").addEventListener("click", (event) => {
    const button = event.target.closest("[data-style]");
    if (!button) return;
    countdownStyle = button.dataset.style;
    savePreferences();
    render();
  });
  ["hours", "minutes", "seconds"].forEach((key) => {
    $(`#custom${key[0].toUpperCase()}${key.slice(1)}`).addEventListener("input", (event) => {
      customDuration[key] = sanitizeDurationValue(event.target.value, key);
      savePreferences();
      showCustomCountdown();
    });
  });
  $(".start-button").addEventListener("click", startActiveCountdown);
  $(".bottom-switch [data-action='now']").addEventListener("click", returnToNow);
  $(".bottom-switch [data-action='countdown']").addEventListener("click", () => { mode = mode === "countdown" ? "home" : "countdown"; openMenu = null; render(); });
  app.addEventListener("pointerdown", (event) => {
    if (!event.target.closest("[data-interactive-panel]")) closePanels();
  });
  window.setInterval(() => { now = new Date(); render(); }, 250);
  render();
})();
  </script>
</body>
</html>
