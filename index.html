
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeNow Studio</title>
  <meta name="description" content="A modern glass world clock and countdown page.">
  <style>
    :root{--font-system:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#080a10;color:#f8fbff;font-family:var(--font-system)}button,input{font:inherit}
    .app{--bg-a:#090b15;--bg-b:#10243a;--bg-c:#513a93;--accent:#86f7ff;--accent-2:#b7ff6d;--text:#f7fbff;--muted:rgba(247,251,255,.66);--glass:rgba(255,255,255,.12);--strong:rgba(255,255,255,.22);--line:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.34);--scale:1;--display-font:var(--font-system);position:relative;display:grid;place-items:center;height:100vh;min-height:620px;overflow:hidden;background:radial-gradient(circle at 18% 12%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 30%),radial-gradient(circle at 82% 20%,color-mix(in srgb,var(--accent-2) 26%,transparent),transparent 28%),linear-gradient(135deg,var(--bg-a),var(--bg-b) 48%,var(--bg-c));color:var(--text);font-family:var(--display-font)}
    .app[data-theme=graphite]{--bg-a:#08090b;--bg-b:#242832;--bg-c:#5d6571;--accent:#d7e3f1;--accent-2:#8ea0b7}.app[data-theme=alpine]{--bg-a:#edf4ff;--bg-b:#cbd9ec;--bg-c:#91aecf;--accent:#0b63ce;--accent-2:#08a3a8;--text:#07131f;--muted:rgba(7,19,31,.62);--glass:rgba(255,255,255,.5);--strong:rgba(255,255,255,.66);--line:rgba(20,40,65,.16);--shadow:rgba(70,93,120,.25)}.app[data-theme=cobalt]{--bg-a:#020817;--bg-b:#073b83;--bg-c:#031f44;--accent:#39d5ff;--accent-2:#fff}.app[data-theme=ember]{--bg-a:#130906;--bg-b:#662817;--bg-c:#ad6d20;--accent:#ffd36f;--accent-2:#ff7a59}.app[data-theme=orchid]{--bg-a:#10051b;--bg-b:#4a145f;--bg-c:#0b2851;--accent:#f49cff;--accent-2:#78e0ff}.app[data-theme=mint]{--bg-a:#061615;--bg-b:#0f504c;--bg-c:#9bd6b0;--accent:#94ffe7;--accent-2:#eaffb7}.app[data-theme=mono]{--bg-a:#f7f7f4;--bg-b:#d9d9d4;--bg-c:#161616;--accent:#111;--accent-2:#707070;--text:#101010;--muted:rgba(16,16,16,.62);--glass:rgba(255,255,255,.58);--strong:rgba(255,255,255,.75);--line:rgba(0,0,0,.16)}.app[data-theme=midnight]{--bg-a:#02040a;--bg-b:#111827;--bg-c:#22304d;--accent:#7dd3fc;--accent-2:#c4b5fd}.app[data-theme=rose]{--bg-a:#1b0810;--bg-b:#5f2038;--bg-c:#d7a295;--accent:#ffd0dc;--accent-2:#ffb86c}.app[data-theme=solar]{--bg-a:#100d04;--bg-b:#4a3d07;--bg-c:#e9a92f;--accent:#fff4a8;--accent-2:#45ffd0}.app[data-theme=ocean]{--bg-a:#03131f;--bg-b:#064667;--bg-c:#1e8b98;--accent:#85f3ff;--accent-2:#b3f5c8}
    .ambient{position:absolute;border-radius:999px;filter:blur(34px);opacity:.46;pointer-events:none}.a1{width:34vw;height:34vw;left:-10vw;top:-11vw;background:var(--accent)}.a2{width:30vw;height:30vw;right:-8vw;bottom:-10vw;background:var(--accent-2)}
    .glass{border:1px solid var(--line);border-radius:8px;background:linear-gradient(140deg,var(--strong),transparent 120%),var(--glass);box-shadow:0 22px 70px var(--shadow);backdrop-filter:blur(28px) saturate(150%)}
    .hourglass{position:fixed;z-index:10;top:clamp(14px,2.3vw,28px);right:clamp(14px,2.3vw,28px);display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);box-shadow:0 12px 34px rgba(0,0,0,.18);color:var(--text);font-size:1rem;opacity:.62;backdrop-filter:blur(20px) saturate(145%)}.hourglass:hover{opacity:.92;background:rgba(255,255,255,.14)}
    .settings{position:fixed;z-index:9;top:clamp(66px,7.8vw,82px);right:clamp(14px,2.3vw,28px);display:grid;gap:13px;width:min(430px,calc(100vw - 28px));padding:15px}.settings label{display:grid;gap:8px;color:var(--muted);font-size:.76rem;font-weight:740}
    input{min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.12);color:var(--text);outline:none}input:not([type=range]){padding:0 11px}input[type=range]{width:100%;accent-color:var(--accent)}
    .select{position:relative}.trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08)),rgba(255,255,255,.12);color:var(--text);padding:8px 11px;text-align:left;backdrop-filter:blur(22px) saturate(150%)}.trigger span{display:grid;gap:2px;min-width:0}.trigger small{color:var(--muted);font-size:.66rem;font-weight:740}.trigger strong{overflow:hidden;font-size:.92rem;font-weight:760;text-overflow:ellipsis;white-space:nowrap}.trigger i{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-style:normal}
    .menu{position:absolute;z-index:20;top:calc(100% + 8px);left:0;right:0;display:grid;gap:6px;max-height:min(292px,42vh);overflow:auto;overscroll-behavior:contain;padding:8px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.12)),color-mix(in srgb,var(--bg-b) 58%,transparent);box-shadow:0 22px 70px var(--shadow);backdrop-filter:blur(30px) saturate(170%);-webkit-overflow-scrolling:touch}.menu button{display:grid;gap:2px;min-height:42px;border:1px solid transparent;border-radius:8px;background:rgba(255,255,255,.08);color:var(--text);padding:8px 10px;text-align:left}.menu button:hover,.menu button.selected{border-color:color-mix(in srgb,var(--accent) 72%,var(--line));background:color-mix(in srgb,var(--accent) 24%,rgba(255,255,255,.14))}.menu span{overflow:hidden;font-size:.86rem;font-weight:760;text-overflow:ellipsis;white-space:nowrap}.menu small{overflow:hidden;color:var(--muted);font-size:.68rem;text-overflow:ellipsis;white-space:nowrap}
    .theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.theme-grid button,.preset button,.start{min-height:32px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.1);color:var(--text);font-size:.72rem;font-weight:760}.theme-grid button.active,.theme-grid button:hover,.preset button:hover,.start:hover{border-color:color-mix(in srgb,var(--accent) 78%,var(--line));background:color-mix(in srgb,var(--accent) 25%,rgba(255,255,255,.12))}
    .stage{position:relative;z-index:1;display:grid;justify-items:center;gap:calc(14px * var(--scale));width:min(94vw,1180px);padding:0 18px calc(86px + 24px * var(--scale));text-align:center}.now{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:38px;padding:0 18px;appearance:none;border:1px solid var(--line);border-radius:8px;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.08)),rgba(255,255,255,.12);box-shadow:0 12px 28px rgba(0,0,0,.18);color:var(--text);font-size:clamp(.86rem,1.1vw,.98rem);font-weight:820;backdrop-filter:blur(20px) saturate(150%);cursor:pointer}.now:hover{border-color:color-mix(in srgb,var(--accent) 72%,var(--line));background:color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.13))}
    .time-wrap{position:relative;display:inline-grid;max-width:100%}.main-time{display:block;max-width:100%;font-family:var(--display-font);font-size:calc(clamp(4.2rem,14vw,13.2rem) * var(--scale));font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:0;line-height:.88;text-shadow:0 0 46px color-mix(in srgb,var(--accent) 35%,transparent);white-space:nowrap}.time-wrap.countdown .main-time{font-size:calc(clamp(3.7rem,12.5vw,11.5rem) * var(--scale))}.date{margin:0;color:var(--muted);font-size:calc(clamp(.95rem,1.6vw,1.28rem) * var(--scale))}
    .panel{position:fixed;z-index:8;left:50%;bottom:clamp(92px,calc(10vh + 20px * var(--scale)),154px);display:grid;gap:12px;width:min(560px,calc(100vw - 28px));padding:15px;transform:translateX(-50%)}.panel .menu{top:auto;bottom:calc(100% + 8px)}.selected,.face{display:grid;justify-items:center;gap:4px;text-align:center}.selected span,.selected small,.face span,.face small{color:var(--muted);font-size:.78rem}.selected strong{font-size:clamp(1.25rem,2.2vw,1.9rem);font-weight:800}.selected time,.face time{color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(2.2rem,6vw,4.4rem);font-variant-numeric:tabular-nums;font-weight:850;line-height:1}.face time{color:var(--accent-2);font-size:clamp(1.9rem,5vw,3.8rem)}
    .count-panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.count-panel .select,.count-panel .preset,.count-panel .face{grid-column:1/-1}.preset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.start{background:color-mix(in srgb,var(--accent-2) 24%,rgba(255,255,255,.12))}
    .bottom{position:fixed;z-index:10;left:50%;bottom:clamp(16px,3vh,30px);display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;width:min(480px,calc(100vw - 28px));transform:translateX(-50%)}.bottom button{height:52px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.13);box-shadow:0 18px 48px var(--shadow);color:var(--text);font-size:clamp(.95rem,1.5vw,1.08rem);font-weight:780;backdrop-filter:blur(24px) saturate(160%)}.bottom button:hover,.bottom button.active{border-color:color-mix(in srgb,var(--accent) 78%,var(--line));background:color-mix(in srgb,var(--accent) 24%,rgba(255,255,255,.14))}
    .hidden{display:none!important}@media(max-width:720px){.app{min-height:680px}.hourglass{width:38px;height:38px;font-size:.92rem}.main-time{font-size:calc(clamp(3.35rem,17.5vw,6.8rem) * var(--scale))}.stage{padding-bottom:calc(104px + 22px * var(--scale))}.theme-grid,.preset{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{bottom:clamp(88px,calc(8vh + 18px * var(--scale)),126px)}.count-panel{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app" data-theme="aurora">
    <div class="ambient a1"></div><div class="ambient a2"></div>
    <button class="hourglass interactive" aria-label="打开显示设置">⌛</button>
    <aside class="settings glass interactive hidden">
      <label>字号大小<input id="size" type="range" min="0.58" max="1.85" step="0.02" value="1"></label>
      <div class="select" data-select="font"></div>
      <div class="theme-grid"></div>
    </aside>
    <section class="stage">
      <button class="now interactive">Now</button>
      <div class="time-wrap"><time class="main-time">00:00:00</time></div>
      <p class="date">正在同步本地时间</p>
    </section>
    <section class="panel world glass interactive hidden">
      <div class="select" data-select="capital"></div>
      <div class="selected"><span></span><strong></strong><time>00:00:00</time><small>同步中</small></div>
    </section>
    <section class="panel count-panel glass interactive hidden">
      <div class="select" data-select="countdown"></div>
      <div class="preset"></div>
      <input class="count-title" aria-label="倒计时名称">
      <input class="count-target" aria-label="修改倒计时目标时间" type="datetime-local" step="1">
      <button class="start">开始</button>
      <div class="face"><span>剩余时间</span><time>00:00:00</time><small>归零后会继续显示已过去时间</small></div>
    </section>
    <nav class="bottom interactive"><button data-mode="world">世界时间</button><button data-mode="countdown">倒计时</button></nav>
  </main>
  <script>
    const capitals=[["中国","北京","Asia/Shanghai"],["美国","华盛顿","America/New_York"],["英国","伦敦","Europe/London"],["法国","巴黎","Europe/Paris"],["德国","柏林","Europe/Berlin"],["日本","东京","Asia/Tokyo"],["韩国","首尔","Asia/Seoul"],["印度","新德里","Asia/Kolkata"],["澳大利亚","堪培拉","Australia/Sydney"],["加拿大","渥太华","America/Toronto"],["巴西","巴西利亚","America/Sao_Paulo"],["俄罗斯","莫斯科","Europe/Moscow"],["阿联酋","阿布扎比","Asia/Dubai"],["新加坡","新加坡","Asia/Singapore"],["南非","比勒陀利亚","Africa/Johannesburg"],["墨西哥","墨西哥城","America/Mexico_City"]];
    const themes=[["aurora","极光玻璃"],["graphite","石墨钛"],["alpine","雪岭白"],["cobalt","钴蓝电弧"],["ember","日落熔金"],["orchid","兰紫霓虹"],["mint","薄荷晶体"],["mono","极简单色"],["midnight","午夜航站"],["rose","玫瑰金"],["solar","太阳风"],["ocean","深海蓝"]];
    const fonts=[["Apple 系统","var(--font-system)"],["System Mono","ui-monospace,SFMono-Regular,Menlo,monospace"],["Times","Times New Roman,serif"],["Rounded","ui-rounded,SF Pro Rounded,Arial,sans-serif"],["Arial","Arial,sans-serif"]];
    const presets=[["ten","10 分钟",10],["fifteen","15 分钟",15],["twenty","20 分钟",20],["thirty","30 分钟",30],["hour","1 小时",60],["ninety","90 分钟",90]];
    const $=s=>document.querySelector(s), app=$(".app");let now=new Date(), mode="home", display="local", openMenu=null, selectedCapital="Asia/Shanghai", activeId="ten";
    const localValue=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19);
    const plus=m=>localValue(new Date(Date.now()+m*60000));
    let countdowns=[["ten","10 分钟",plus(10)],["fifteen","15 分钟",plus(15)],["twenty","20 分钟",plus(20)],["thirty","30 分钟",plus(30)],["hour","1 小时",plus(60)],["ninety","90 分钟",plus(90)],["custom","自定义倒计时",plus(45)]];
    const fmt=(d,z,o)=>new Intl.DateTimeFormat("zh-CN",{timeZone:z,...o}).format(d);
    const week=(d,z)=>{let y,m,day;if(z){const p=new Intl.DateTimeFormat("en-CA",{timeZone:z,year:"numeric",month:"numeric",day:"numeric"}).formatToParts(d);y=+p.find(x=>x.type==="year").value;m=+p.find(x=>x.type==="month").value;day=+p.find(x=>x.type==="day").value}else{y=d.getFullYear();m=d.getMonth()+1;day=d.getDate()}const u=new Date(Date.UTC(y,m-1,day)),wd=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-wd);const ys=new Date(Date.UTC(u.getUTCFullYear(),0,1));return Math.ceil(((u-ys)/86400000+1)/7)};
    const dateWithWeek=(d,z)=>`${new Intl.DateTimeFormat("zh-CN",{...(z?{timeZone:z}:{}),weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(d)} · 第 ${week(d,z)} 周`;
    const dur=(ms,ceil=false)=>{let t=Math.max(0,(ceil?Math.ceil:Math.floor)(ms/1000)),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;return d?`${d}天 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`};
    const active=()=>countdowns.find(x=>x[0]===activeId)||countdowns[0], cap=()=>capitals.find(x=>x[2]===selectedCapital)||capitals[0];
    function closePanels(){openMenu=null;mode="home";$(".settings").classList.add("hidden");render()}
    function selectHTML(kind,label,opts,value){const sel=opts.find(o=>o.value===value)||opts[0];return `<button class="trigger" aria-expanded="${openMenu===kind}"><span><small>${label}</small><strong>${sel.label}</strong></span><i>⌄</i></button>${openMenu===kind?`<div class="menu">${opts.map(o=>`<button data-value="${o.value}" class="${o.value===value?"selected":""}"><span>${o.label}</span>${o.detail?`<small>${o.detail}</small>`:""}</button>`).join("")}</div>`:""}`}
    function wireSelect(kind,label,opts,value,onChange){const root=document.querySelector(`[data-select="${kind}"]`),cache=JSON.stringify({kind,label,opts,value,open:openMenu===kind});if(root.dataset.cache!==cache){root.dataset.cache=cache;root.innerHTML=selectHTML(kind,label,opts,value);root.querySelector(".trigger").onclick=()=>{openMenu=openMenu===kind?null:kind;render()};const menu=root.querySelector(".menu");if(menu)menu.onpointerdown=e=>e.stopPropagation();root.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>{onChange(b.dataset.value);openMenu=null;render()})}}
    function render(){const a=active(), delta=new Date(a[2])-now, done=delta<=0, c=cap();document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));$(".world").classList.toggle("hidden",mode!=="world");$(".count-panel").classList.toggle("hidden",mode!=="countdown");$(".time-wrap").classList.toggle("countdown",display==="countdown");
      $(".main-time").textContent=display==="world"?fmt(now,c[2],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):display==="countdown"?(done?dur(Math.abs(delta)):dur(delta,true)):now.toLocaleTimeString("zh-CN",{hour12:false});
      $(".date").textContent=display==="world"?`${c[0]} · ${c[1]} · ${dateWithWeek(now,c[2])}`:display==="countdown"?`${a[1]} · ${done?"已经结束":"倒计时进行中"}`:dateWithWeek(now);
      wireSelect("font","字体",fonts.map(x=>({label:x[0],value:x[1]})),app.style.getPropertyValue("--display-font")||"var(--font-system)",v=>app.style.setProperty("--display-font",v));
      wireSelect("capital","选择国家首都",capitals.map(x=>({label:`${x[0]} · ${x[1]}`,value:x[2],detail:x[2]})),selectedCapital,v=>{selectedCapital=v;display="world"});
      wireSelect("countdown","选择倒计时",countdowns.map(x=>({label:x[1],value:x[0],detail:x[2].replace("T"," ")})),activeId,v=>{activeId=v;const p=presets.find(x=>x[0]===v);if(p){const t=plus(p[2]);countdowns=countdowns.map(x=>x[0]===v?[x[0],p[1],t]:x)}});
      $(".selected span").textContent=c[0];$(".selected strong").textContent=c[1];$(".selected time").textContent=fmt(now,c[2],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});$(".selected small").textContent=dateWithWeek(now,c[2]);
      $(".count-title").value=a[1];$(".count-target").value=a[2];$(".face span").textContent=done?"已经结束":"剩余时间";$(".face time").textContent=done?dur(Math.abs(delta)):dur(delta,true);$(".face small").textContent=done?`结束后已过去 ${dur(Math.abs(delta))}`:"归零后会继续显示已过去时间";
    }
    $(".hourglass").onclick=()=>{$(".settings").classList.toggle("hidden");openMenu=null;render()};$(".now").onclick=()=>{display="local";closePanels()};$("#size").oninput=e=>app.style.setProperty("--scale",e.target.value);
    $(".theme-grid").innerHTML=themes.map(t=>`<button data-theme="${t[0]}">${t[1]}</button>`).join("");document.querySelectorAll(".theme-grid button").forEach(b=>b.onclick=()=>{app.dataset.theme=b.dataset.theme;document.querySelectorAll(".theme-grid button").forEach(x=>x.classList.toggle("active",x===b))});document.querySelector("[data-theme=aurora]").classList.add("active");
    $(".preset").innerHTML=presets.map(p=>`<button data-min="${p[2]}" data-id="${p[0]}">${p[1]}</button>`).join("");document.querySelectorAll(".preset button").forEach(b=>b.onclick=()=>{activeId=b.dataset.id;const t=plus(+b.dataset.min),p=presets.find(x=>x[0]===activeId);countdowns=countdowns.map(x=>x[0]===activeId?[x[0],p[1],t]:x);display="countdown";mode="home";openMenu=null;render()});
    $(".count-title").oninput=e=>{countdowns=countdowns.map(x=>x[0]===activeId?[x[0],e.target.value,x[2]]:x)};$(".count-target").oninput=e=>{countdowns=countdowns.map(x=>x[0]===activeId?[x[0],x[1],e.target.value]:x)};$(".start").onclick=()=>{now=new Date();display="countdown";mode="home";openMenu=null;render()};
    document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{mode=mode===b.dataset.mode?"home":b.dataset.mode;openMenu=null;render()});app.addEventListener("pointerdown",e=>{if(!e.target.closest(".interactive"))closePanels()});setInterval(()=>{now=new Date();render()},250);render();
  </script>
</body>
</html>
